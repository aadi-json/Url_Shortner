[project]
name = "shortly-url-shortener"
version = "1.0.0"
description = "A Flask URL shortener application"
requires-python = ">=3.11"
dependencies = [
    "Flask",
    "Flask-SQLAlchemy",
    "Flask-Migrate",
    "Flask-Login",
    "Flask-WTF",
    "email-validator",
    "python-dotenv",
    "gunicorn",
]

[tool.vercel]
entrypoint = "run:app"