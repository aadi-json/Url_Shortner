{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<form method="post" class="max-w-sm mx-auto bg-white p-6 rounded shadow space-y-4">
  <h1 class="text-xl font-semibold">Log in</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input name="email" type="email" placeholder="Email" required class="w-full border rounded px-3 py-2">
  <input name="password" type="password" placeholder="Password" required class="w-full border rounded px-3 py-2">
  <button class="w-full bg-indigo-600 text-white py-2 rounded">Log in</button>
</form>
{% endblock %}
