<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shortly{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <nav class="bg-white border-b">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{{ url_for('main.index') }}" class="font-bold text-lg text-indigo-600">Shortly</a>
      <div class="flex items-center gap-4 text-sm">
        {% if current_user.is_authenticated %}
          <span class="text-slate-500">{{ current_user.email }}</span>
          <form method="post" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="text-indigo-600 hover:underline">Log out</button>
          </form>
        {% else %}
          <a href="{{ url_for('auth.login') }}" class="hover:underline">Log in</a>
          <a href="{{ url_for('auth.signup') }}" class="bg-indigo-600 text-white px-3 py-1.5 rounded">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="max-w-4xl mx-auto px-4 py-8">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="mb-4 px-4 py-2 rounded text-sm {{ 'bg-red-100 text-red-700' if category == 'error' else 'bg-green-100 text-green-700' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
